        window.deleteArea = function (id) {
            if (confirm("Delete this offline area and its downloaded tiles?")) {
                db.areas.delete(id).then(() => {
                    db.tiles.where('areaId').equals(id).delete().then(() => {
                        showToast("Offline area deleted");
                        loadAreas();
                    });
                }).catch(err => {
                    console.error("Delete failed:", err);
                    showToast("Failed to delete");
                });
            }
        };

        // --- 8. Places Management Logic ---
        async function loadPlaces() {
            activePlaceMarkers.forEach(m => map.removeLayer(m));
            activePlaceMarkers = [];

            try {
                const places = await db.places.toArray();
                places.forEach(place => {
                    createPlaceMarker(place);
                });
                updateDistanceTracker();
            } catch (err) {
                console.error("Failed to load saved places:", err);
            }
        }

        function createPlaceMarker(place) {
            const marker = L.marker([place.lat, place.lng], { icon: placeIcon }).addTo(map);

            const pathText = place.customRoutePoints && place.customRoutePoints.length > 0 ? "Toggle Path" : "Draw Path";
            const activePathColor = activeCustomRoutePlaceId === place.id ? "#ea4335" : "#8e24aa";

            marker.bindPopup(`
                <div style="font-family: inherit; font-size: 12px; padding: 4px; display: flex; flex-direction: column; gap: 8px; min-width: 100px; text-align: center;">
                    <strong style="color: var(--text-primary); font-size:13px; display:block;">${place.name}</strong>
                    <div style="display:flex; justify-content: center; gap:16px; margin-top: 4px;">
                        <button class="btn-text" style="color: #1a73e8; font-size: 13px;" onclick="window.editPlaceName(${place.id})" title="Rename Place">✏️ Rename</button>
                        <button class="btn-text" style="color: var(--accent-color); font-size: 13px;" onclick="window.deletePlace(${place.id})" title="Delete Place">🗑️ Delete</button>
                    </div>
                </div>
            `);

            marker.on('click', (e) => {
                if (routeModeActive) {
                    L.DomEvent.stopPropagation(e);
                    setTimeout(() => { map.closePopup(); }, 10);
                    onMapClickForRoute(e);
                }
            });

            marker.placeData = place;
            activePlaceMarkers.push(marker);
        }

        window.editPlaceName = async function (id) {
            try {
                const place = await db.places.get(id);
                if (!place) return;

                const newName = prompt("Edit name for this place:", place.name);
                if (newName !== null && newName.trim() !== "") {
                    await db.places.update(id, { name: newName.trim() });
                    showToast("Place name updated!");
                    map.closePopup();
                    await loadPlaces();
                }
            } catch (err) {
                console.error(err);
                showToast("Failed to edit place name");
            }
        };

        window.deletePlace = async function (id) {
            try {
                const place = await db.places.get(id);
                if (!place) return;

                if (confirm(`Delete place "${place.name}"?`)) {
                    await db.places.delete(id);
                    showToast(`Deleted "${place.name}"`);
                    map.closePopup();

                    const marker = activePlaceMarkers.find(m => m.placeData && m.placeData.id === id);
                    if (marker) {
                        map.removeLayer(marker);
                        activePlaceMarkers = activePlaceMarkers.filter(m => m !== marker);
                    }

                    if (activeCustomRoutePlaceId === id && routePolyline) {
                        map.removeLayer(routePolyline);
                        routePolyline = null;
                        activeCustomRoutePlaceId = null;
                    }

                    document.getElementById('search-results').classList.remove('visible');
                    updateDistanceTracker();
                }
            } catch (err) {
                console.error(err);
                showToast("Failed to delete place");
            }
        };

        function showAllTooltips() {
            activePlaceMarkers.forEach(marker => {
                marker.bindTooltip(marker.placeData.name, {
                    permanent: true,
                    direction: 'top',
                    className: 'custom-place-tooltip'
                }).openTooltip();
            });
        }

        function hideAllTooltips() {
            activePlaceMarkers.forEach(marker => {
                marker.unbindTooltip();
            });
        }

        async function updateDistanceTracker() {
            distancePolylines.forEach(l => map.removeLayer(l));
            distancePolylines = [];
            distanceLabels.forEach(lbl => map.removeLayer(lbl));
            distanceLabels = [];
            proximityLines.forEach(l => map.removeLayer(l));
            proximityLines = [];
        }

        // --- 9. Search System ---
        async function handleSearchInput() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const clearBtn = document.getElementById('search-clear-btn');
            const resultsContainer = document.getElementById('search-results');

            if (query !== "all") {
                hideAllTooltips();
            }

            if (query === "") {
                clearBtn.style.display = 'none';
                resultsContainer.innerHTML = "";
                resultsContainer.style.display = 'none';
                return;
            }

            clearBtn.style.display = 'flex';

            if (query === "all") {
                showAllTooltips();
                const matches = await db.places.toArray();
                resultsContainer.innerHTML = '<div style="padding:10px; font-size:12px; color:var(--primary-color); font-weight:bold; text-align:center;">Showing all place name tags on map</div>';
                
                matches.forEach(place => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.innerHTML = `<span class="place-name-text">${place.name}</span>`;
                    item.onclick = () => {
                        map.setView([place.lat, place.lng], 16);
                        const marker = activePlaceMarkers.find(m => m.getLatLng().lat === place.lat && m.getLatLng().lng === place.lng);
                        if (marker) {
                            marker.openPopup();
                        }
                        document.getElementById('search-input').value = "";
                        resultsContainer.style.display = 'none';
                    };
                    resultsContainer.appendChild(item);
                });
                resultsContainer.style.display = 'block';
                return;
            }

            try {
                const matches = await db.places.filter(p => p.name.toLowerCase().includes(query)).toArray();

                if (matches.length === 0) {
                    resultsContainer.innerHTML = '<div style="padding:10px; font-size:12px; color:#999; text-align:center;">No places found</div>';
                    resultsContainer.style.display = 'block';
                    return;
                }

                resultsContainer.innerHTML = "";
                matches.forEach(place => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';

                    // Create Name text span
                    const textSpan = document.createElement('span');
                    textSpan.className = 'place-name-text';
                    textSpan.innerText = place.name;

                    // Create Button Container to hold Route, Draw, Track
                    const btnContainer = document.createElement('div');
                    btnContainer.style.display = 'flex';
                    btnContainer.style.gap = '4px';
                    btnContainer.onclick = (e) => e.stopPropagation();

                    // Create Route Action button
                    const routeBtn = document.createElement('button');
                    routeBtn.className = 'btn-search-route';
                    routeBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:currentColor;"><path d="M22.41 12.3l-9-9c-.39-.39-1.02-.39-1.41 0l-9 9c-.39.39-.39 1.02 0 1.41l9 9c.39.39 1.02.39 1.41 0l9-9c.39-.39.39-1.02 0-1.41zM14 18.5V15h-4v-3h4V8.5L18.5 12 14 18.5z"/></svg>
                        Route
                    `;
                    routeBtn.onclick = (e) => {
                        e.stopPropagation();
                        window.calculateRouteToPlace(place.id, e);
                    };

                    // Create Draw button
                    const drawBtn = document.createElement('button');
                    drawBtn.className = 'btn-search-route';
                    drawBtn.style.backgroundColor = '#8e24aa';
                    drawBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:currentColor;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        Draw
                    `;
                    drawBtn.onclick = (e) => {
                        e.stopPropagation();
                        window.startCustomPathDrawing(place.id, e);
                    };

                    // Create Track button
                    const trackBtn = document.createElement('button');
                    trackBtn.className = 'btn-search-route';
                    trackBtn.style.backgroundColor = '#e27200';
                    trackBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:currentColor;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.83 0-.38.03-.75.09-1.12L9 14v1c0 1.1.9 2 2 2v2.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        Track
                    `;
                    trackBtn.onclick = (e) => {
                        e.stopPropagation();
                        window.trackCustomRoute(place.id, e);
                    };

                    btnContainer.appendChild(routeBtn);
                    btnContainer.appendChild(drawBtn);
                    btnContainer.appendChild(trackBtn);

                    // Set item click to zoom
                    item.onclick = () => {
                        map.setView([place.lat, place.lng], 16);
                        const marker = activePlaceMarkers.find(m => m.getLatLng().lat === place.lat && m.getLatLng().lng === place.lng);
                        if (marker) {
                            marker.openPopup();
                        }
                        document.getElementById('search-input').value = "";
                        resultsContainer.style.display = 'none';
                    };

                    item.appendChild(textSpan);
                    item.appendChild(btnContainer);
                    resultsContainer.appendChild(item);
                });
                resultsContainer.style.display = 'block';
            } catch (err) {
                console.error(err);
            }
        }

        window.calculateRouteToPlace = async function (placeId, event) {
            if (event) {
                event.stopPropagation();
            }

            // Ensure GPS tracking is running
            if (!watchId) {
                window.startGpsTracking();
            }

            if (!currentUserLocation) {
                showToast("Locating your position...");
                let attempts = 0;
                const checkLocationInterval = setInterval(async () => {
                    attempts++;
                    if (currentUserLocation) {
                        clearInterval(checkLocationInterval);
                        await performRouteToPlace(placeId);
                    } else if (attempts >= 10) { // 5 seconds timeout
                        clearInterval(checkLocationInterval);
                        showToast("GPS timeout. Please check device location settings.");
                    }
                }, 500);
                return;
            }

            await performRouteToPlace(placeId);
        };

        async function performRouteToPlace(placeId) {
            try {
                const place = await db.places.get(placeId);
                if (!place) {
                    showToast("Place not found");
                    return;
                }

                // Hide search results
                document.getElementById('search-results').style.display = 'none';
                document.getElementById('search-input').value = "";

                // Activate Route Planner
                if (!routeModeActive) {
                    window.toggleRouteMode();
                }

                // Draw route points
                clearRoute();
                routeStartPoint = L.latLng(currentUserLocation.lat, currentUserLocation.lng);
                routeEndPoint = L.latLng(place.lat, place.lng);
                routeEndMarker = L.marker(routeEndPoint, { icon: endIcon }).addTo(map);

                calculateAndShowRoute(true, placeId);
            } catch (err) {
                console.error(err);
                showToast("Failed to generate route");
            }
        }

        window.trackCustomRoute = async function (placeId, event) {
            if (event) event.stopPropagation();

            // Close search results and search bar
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('search-input').value = "";
            window.closeSearchBar();

            try {
                const place = await db.places.get(placeId);
                if (!place || !place.customRoutePoints || place.customRoutePoints.length === 0) {
                    showToast("No custom route drawn for this place. Click Draw first!");
                    return;
                }

                // Clear any existing route
                clearRoute();
                activeCustomRoutePlaceId = placeId;

                // Construct path coordinates starting from user location if available
                let latlngs = [];
                if (currentUserLocation) {
                    latlngs.push([currentUserLocation.lat, currentUserLocation.lng]);
                }

                // Append custom route points
                place.customRoutePoints.forEach(p => {
                    latlngs.push([p[0], p[1]]);
                });

                // Draw route line
                if (routePolyline) map.removeLayer(routePolyline);
                routePolyline = L.polyline(latlngs, {
                    color: '#8e24aa', // Purple color for custom routes
                    weight: 6,
                    opacity: 0.8,
                    lineJoin: 'round'
                }).addTo(map);

                // Double click on custom route polyline to delete it
                routePolyline.on('dblclick', (e) => {
                    L.DomEvent.stopPropagation(e);
                    if (activeCustomRoutePlaceId) {
                        if (confirm("Do you want to delete this custom route?")) {
                            deleteCustomRoute(activeCustomRoutePlaceId);
                        }
                    }
                });

                // Add end marker
                routeEndPoint = L.latLng(place.lat, place.lng);
                routeEndMarker = L.marker(routeEndPoint, { icon: endIcon }).addTo(map);

                // Zoom map to show the custom route
                map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

                // Calculate steps for vibration turn alerts
                currentRouteSteps = calculateStepsFromCoordinates(latlngs);
                vibratedTurns = [];

                let totalDist = 0;
                for (let i = 0; i < latlngs.length - 1; i++) {
                    totalDist += getDistance(latlngs[i][0], latlngs[i][1], latlngs[i+1][0], latlngs[i+1][1]);
                }
                const banner = document.getElementById('route-banner');
                banner.innerText = `Route Distance: ${totalDist.toFixed(2)} km`;
                banner.classList.add('visible');

                showToast(`Tracking custom route for: ${place.name}`);
            } catch (err) {
                console.error("Failed to track custom route:", err);
                showToast("Failed to start custom tracking");
            }
        };

        window.deleteCustomRoute = function (placeId) {
            db.places.update(placeId, { customRoutePoints: [] }).then(() => {
                showToast("Custom route deleted");
                clearRoute();
                loadPlaces();
            });
        };

        document.addEventListener('click', (e) => {
            const container = document.getElementById('search-container');
            const results = document.getElementById('search-results');
            if (container && !container.contains(e.target) && results) {
                results.style.display = 'none';
            }
        });

        window.clearSearchInput = function () {
            const input = document.getElementById('search-input');
            input.value = '';
            handleSearchInput();
            input.focus();
        };

        // --- 10. Vibration Navigation ---
        window.toggleVibrationNavigation = function () {
            vibrationNavigationActive = !vibrationNavigationActive;
            const btn = document.getElementById('vibrate-toggle-btn');
            if (vibrationNavigationActive) {
                btn.style.backgroundColor = '#e27200';
                showToast("Vibration Navigation Active");

                playAudioVoiceAlert("Active");
                playBeep(1000, 150);

                if (navigator.vibrate) {
                    navigator.vibrate([200, 100, 200]);
                }
            } else {
                btn.style.backgroundColor = 'var(--text-secondary)';
                showToast("Vibration Navigation Disabled");
            }
        };

        function checkRouteTurnProximity(userLat, userLng) {
            if (!vibrationNavigationActive || !currentRouteSteps || currentRouteSteps.length === 0) return;

            let nextTurn = null;

            for (let i = 0; i < currentRouteSteps.length; i++) {
                const step = currentRouteSteps[i];
                if (!step.maneuver || !step.maneuver.location) continue;

                const modifier = step.maneuver.modifier;
                if (!modifier) continue;

                const m = modifier.toLowerCase();
                const isLeft = m.includes('left');
                const isRight = m.includes('right');

                if (isLeft || isRight) {
                    nextTurn = { step, isLeft, isRight };
                    break;
                }
            }

            if (!nextTurn) return;

            const turnLng = nextTurn.step.maneuver.location[0];
            const turnLat = nextTurn.step.maneuver.location[1];
            const distanceMeters = getDistance(userLat, userLng, turnLat, turnLng) * 1000;

            let alreadyVibrated = false;
            for (let i = 0; i < vibratedTurns.length; i++) {
                const vt = vibratedTurns[i];
                const d = getDistance(turnLat, turnLng, vt.lat, vt.lng) * 1000;
                if (d < 30) {
                    alreadyVibrated = true;
                    
                    const distFromUser = getDistance(userLat, userLng, vt.lat, vt.lng) * 1000;
                    if (distFromUser > 40) {
                        vibratedTurns.splice(i, 1);
                        alreadyVibrated = false; 
                    }
                    break;
                }
            }

            if (alreadyVibrated) return;

            if (distanceMeters <= 15) {
                vibratedTurns.push({ lat: turnLat, lng: turnLng, time: Date.now() });

                if (vibratedTurns.length > 5) {
                    vibratedTurns.shift();
                }

                const direction = nextTurn.isLeft ? "LEFT" : "RIGHT";

                playAudioVoiceAlert(direction);
                if (nextTurn.isLeft) {
                    playBeep(800, 300);
                } else if (nextTurn.isRight) {
                    playBeep(1200, 300);
                    setTimeout(() => playBeep(1200, 300), 500);
                    setTimeout(() => playBeep(1200, 300), 1000);
                }

                if (navigator.vibrate) {
                    if (nextTurn.isLeft) {
                        navigator.vibrate(1000);
                        showToast("Turn LEFT ahead! 📳");
                    } else if (nextTurn.isRight) {
                        navigator.vibrate(3000);
                        showToast("Turn RIGHT ahead! 📳📳📳");
                    }
                } else {
                    showToast(`Turn approaching: ${direction} in ${distanceMeters.toFixed(0)}m`);
                }
            }
        }

        function playAudioVoiceAlert(direction) {
            try {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    const phrase = direction === "Active" ? "Vibration navigation active" : `Turn ${direction.toLowerCase()} in ten meters`;
                    const speech = new SpeechSynthesisUtterance(phrase);
                    speech.lang = 'en-US';
                    speech.rate = 1.0;
                    speech.pitch = 1.0;
                    window.speechSynthesis.speak(speech);
                }
            } catch (e) {
                console.warn("Speech Synthesis failed:", e);
            }
        }

        function playBeep(frequency, durationMs) {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;

                const audioCtx = new AudioContextClass();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + durationMs / 1000);
            } catch (e) {
                console.warn("Beep failed:", e);
            }
        }

        function showToast(msg) {
            if (window.AndroidNative && typeof window.AndroidNative.showNativeToast === 'function') {
                try {
                    window.AndroidNative.showNativeToast(msg);
                    return;
                } catch (e) {
                    console.error("Native toast failed:", e);
                }
            }
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // --- 11. Initial Load & Wake Lock ---
        loadAreas();
        loadPlaces();

        // Make map and its controls visible on startup by default
        mapContainer.classList.add('visible');
        downloadBtn.style.display = 'flex';
        document.getElementById('route-mode-btn').style.display = 'flex';
        document.getElementById('add-place-btn').style.display = 'flex';
        document.getElementById('search-toggle-btn').style.display = 'flex';
        document.getElementById('label-toggle-btn').style.display = 'flex';
        document.getElementById('vibrate-toggle-btn').style.display = 'flex';
        setTimeout(() => {
            map.invalidateSize();
        }, 100);

        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock active!');
                }
            } catch (err) {
                console.warn(`Wake Lock Error: ${err.message}`);
            }
        }

        requestWakeLock();

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
